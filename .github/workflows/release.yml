name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: node --test $(find tests -name '*.test.mjs')

      - name: Régler version et URL de téléchargement d'après l'étiquette
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          export VERSION="${TAG#v}"
          node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync("system.json", "utf8"));
            j.version = process.env.VERSION;
            j.download = `https://github.com/${process.env.REPO}/releases/download/${process.env.TAG}/metro-2033-yze.zip`;
            fs.writeFileSync("system.json", JSON.stringify(j, null, 2) + "\n");
          '
        shell: bash

      - name: Archive
        run: scripts/build-archive.sh dist

      - name: Joindre à la Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/system.json
            dist/metro-2033-yze.zip
